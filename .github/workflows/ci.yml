name: CI

# every pull request, and every merge queue entry, builds the compiler on the
# linux runners. the windows and darwin lanes run when a dispatch names one.
# `lane=all` on dev is the release gate.

on:
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      lane:
        description: lane to run beside the pull request lanes
        type: choice
        default: none
        options: [none, all, windows, darwin, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # the bootstrap chain builds the compiler, which builds itself to the fixpoint
  host:
    name: host ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,  runs-on: ubuntu-latest }
          - { target: aarch64-linux, runs-on: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh --fixpoint
      - name: formatter
        run: '"$MACH" fmt --check .'

  host-windows:
    name: host x86_64-windows
    if: contains(fromJSON('["all", "windows"]'), inputs.lane)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh --fixpoint

  host-darwin:
    name: host ${{ matrix.target }}
    if: contains(fromJSON('["all", "darwin"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-darwin, runs-on: macos-15 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh --fixpoint

  # the compiler cross-built for the targets no native runner here covers
  cross:
    name: cross ${{ matrix.target }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [darwin-x86_64, darwin-aarch64, linux-riscv64]
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh
      - name: cross-build the compiler
        run: '"$MACH" build . --target "${{ matrix.target }}" --profile release -o "out/cross-${{ matrix.target }}"'

  release:
    name: release ${{ matrix.target }}
    if: contains(fromJSON('["all", "release"]'), inputs.lane)
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-linux,   runs-on: ubuntu-latest }
          - { target: aarch64-linux,  runs-on: ubuntu-24.04-arm }
          - { target: x86_64-windows, runs-on: windows-latest }
          - { target: aarch64-darwin, runs-on: macos-15 }
          - { target: x86_64-darwin,  runs-on: macos-15-intel }
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/scripts/bootstrap.sh --fixpoint --profile release

  gate:
    name: gate
    if: always()
    needs: [host, host-windows, host-darwin, cross, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
