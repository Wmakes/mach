[project]
id = "mach"
version = "6.10.1"
mach = "^6"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
isa = "x86_64"
os  = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os  = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os  = "linux"
abi = "lp64d"

[target.windows-x86_64]
isa  = "x86_64"
os   = "windows"
abi  = "win64"
# 8 MiB, the linux and darwin main-thread default, so every host starts the
# compiler and its tests on the same stack
stack_reserve = 0x800000

[target.darwin-x86_64]
isa = "x86_64"
os  = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os  = "darwin"
abi = "aapcs64"

# MachOS programs are static x86_64 ELF images linked at 4 MiB. The platform
# selects the MachOS syscall layer in the operating system's std fork.
[target.machos]
isa      = "x86_64"
os       = "freestanding"
abi      = "sysv64"
of       = "elf"
base     = 0x400000
platform = "machos"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.mach]
kind = "bin"
default = true
entry = "bin/main.mach"
out = "bin/mach"
targets = ["linux-x86_64", "linux-arm64", "linux-riscv64", "darwin-x86_64", "darwin-aarch64", "machos"]
link = []
need = []

[artifact.mach-windows]
kind = "bin"
default = true
entry = "bin/main.mach"
out = "bin/mach.exe"
targets = ["windows-x86_64"]
link = []
need = []

# the test-only modules no compiler entry reaches; `mach test . -a tests` runs them
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "lib/tests"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/Wmakes/machos-std"
ref = "commit/40117e91031830f125f40d85733b608b9b5c72a2"

[dep.http]
git = "https://github.com/briar-systems/mach-http"
version = "^0.25.1"

[dep.tls]
git = "https://github.com/briar-systems/mach-tls"
version = "^0.17.0"
