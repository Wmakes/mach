# an `ext` declared after a gate only layout can decide links under its C name
#. before the fix the load walk stopped at such a gate, the
# declarations after it were never walked, and the link asked for
# `case.sys.probe_answer` instead of `probe_answer`, through
# an orphan module a test build loaded; a test build loads only the
# artifact's closure, so `sys` is reached through the entry's import, and the
# case holds the walk to passing the gate on that path. the probe is a C object
# the leg's own toolchain builds, so the symbol has the same name on every leg
# and no system library is opened.
#
# `goal: test` makes the compile step `mach test`, which also runs
# the collected test, and exec then records what the test printed through the
# dispatcher. the darwin legs are where it showed.
goal: test
run: exec
#
# `gbuild: yes` repeats the test build with `-g` on every leg: a
# module's normal object and its test object both carry the module's DWARF,
# and a test build with debug info has to link on every format.
gbuild: yes
