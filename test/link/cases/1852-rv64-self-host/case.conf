# the riscv64 self-host smoke. `self-host` builds this case with the current
# compiler cross-built for the leg and driven under the leg's engine, that is
# the riscv64 compiler executing under qemu-riscv64 — then the exec producer runs the
# artifact it emits and diffs its stdout. this is the only place the compiler itself
# runs on riscv64 in CI; the other qemu cases only run produced binaries. release
# profile exercises the -O2 self-host path where a phi codegen defect once lived.
legs: riscv64-linux
profiles: release
self-host: linux-riscv64
