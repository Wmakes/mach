# a host binary requires a spirv shader artifact and embeds it through
# `{artifact.<id>.out}`, the manifest's documented shader flow.
#
# THE DELIVERED FILE IS THE CASE. a finished-module target must not deliver
# only its module tree under obj/, or the template names a file nothing wrote and
# the embed fails. the producer validates the module at the path the template
# names and proves the program carries exactly those bytes, so a delivery at some
# other path, a stale file, or an embed of the wrong module all fail.
legs: x86_64-linux
