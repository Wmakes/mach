# byte-identical #[embed] content declared by three MODULES of one artifact must
# occupy ONE final placement. deduplicating within a module is not enough: the
# object boundary lost the embed marker, so the final linker concatenated the same
# bytes once per module.
#
# the observable is the emitted image, not an address comparison inside the
# program: two declarations can compare equal while the bytes are still emitted
# twice with only one copy referenced, so the producer scans the file and counts
# occurrences of each asset's byte sequence.
legs: x86_64-linux
