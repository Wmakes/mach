# a fragment stage's integer and 64-bit inputs carry the Flat decoration Vulkan
# requires, validated host-side against the VULKAN environment.
#
# THE ENVIRONMENT IS THE WHOLE CASE. `Flat` is a Vulkan interface rule and the
# universal environment does not apply it, so a `spirv-val` leg with no target-env
# reports this module clean whether the decoration is there or not. Without
# the Flat decoration every module of this shape is
# one a Vulkan consumer rejects, with no diagnostic from mach.
run: spirv-val-vulkan
legs: x86_64-linux
target: spirv
